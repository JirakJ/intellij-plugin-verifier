# Reusable workflow for IntelliJ Plugin verification
# Called from individual plugin repos via workflow_call
#
# Usage in plugin repo (.github/workflows/verify.yml):
#   jobs:
#     verify:
#       uses: JirakJ/intellij-plugin-verifier/.github/workflows/verify-plugin.yml@main
#       with:
#         gradle-plugin-version: '2.x'  # or '1.x'
name: Verify IntelliJ Plugin

on:
  workflow_call:
    inputs:
      gradle-plugin-version:
        description: 'Gradle IntelliJ Plugin version: "2.x" (modern) or "1.x" (legacy)'
        required: false
        type: string
        default: '2.x'
      java-version:
        description: 'Java version for the build'
        required: false
        type: string
        default: '17'
      gradle-args:
        description: 'Additional Gradle arguments'
        required: false
        type: string
        default: ''
      runner-label:
        description: 'Runner to run on: "ubuntu-latest" (GitHub-hosted) or a self-hosted label e.g. "rpi"'
        required: false
        type: string
        default: 'ubuntu-latest'
      detekt:
        description: 'Run ./gradlew detekt as a blocking gate'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 60
    secrets:
      PLUGIN_TOKEN:
        required: false

jobs:
  build-and-verify:
    name: Build, Test & Verify
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Configure caches (host-specific)
        shell: bash
        run: |
          if [ "${{ inputs.runner-label }}" = "ubuntu-latest" ]; then
            # GitHub-hosted: cramped / (~21 GB) can't hold gradle caches + the 4
            # full IDEs verifyPlugin downloads. /mnt has ~74 GB — stage both there.
            sudo mkdir -p /mnt/gradle /mnt/pluginVerifier
            sudo chown -R "$(id -u):$(id -g)" /mnt/gradle /mnt/pluginVerifier
            mkdir -p "$HOME/.cache"
            ln -sfn /mnt/pluginVerifier "$HOME/.cache/pluginVerifier"
            echo "GRADLE_USER_HOME=/mnt/gradle" >> "$GITHUB_ENV"
            df -h / /mnt
          else
            # Self-hosted (e.g. Pi): roomy disk, use the warm ~/.gradle cache.
            echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"
            df -h "$HOME" || true
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Remote build cache Post-step hangs on a home uplink (self-hosted).
          cache-disabled: ${{ inputs.runner-label != 'ubuntu-latest' }}

      - name: Free disk space
        # GitHub-hosted only. verifyPlugin downloads several full IDEs (~20 GB);
        # the default runner disk isn't enough. Reclaim ~25-30 GB. tool-cache:false
        # keeps the JDK installed by setup-java above. This action is Ubuntu/apt-
        # specific and would wreck a self-hosted host, so gate it.
        if: inputs.runner-label == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk space after cleanup
        if: inputs.runner-label == 'ubuntu-latest'
        run: df -h / /mnt

      - name: Build plugin
        # Retry network-bound gradle tasks: a self-hosted runner on flaky WiFi
        # can drop mid dependency/IDE download; Gradle resumes from its cache on
        # the next attempt. Tests are NOT retried (local, would mask real fails).
        run: |
          n=0; until ./gradlew buildPlugin ${{ inputs.gradle-args }}; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::buildPlugin failed after $n attempts"; exit 1; }
            echo "::warning::buildPlugin attempt $n failed (transient network?), retrying in 30s"; sleep 30
          done

      - name: Static analysis (detekt)
        if: inputs.detekt
        run: ./gradlew detekt ${{ inputs.gradle-args }}

      - name: Run tests
        run: ./gradlew test ${{ inputs.gradle-args }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify plugin compatibility (modern 2.x)
        if: inputs.gradle-plugin-version == '2.x'
        run: |
          n=0; until ./gradlew verifyPlugin ${{ inputs.gradle-args }}; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::verifyPlugin failed after $n attempts"; exit 1; }
            echo "::warning::verifyPlugin attempt $n failed (transient network?), retrying in 30s"; sleep 30
          done

      - name: Verify plugin compatibility (legacy 1.x)
        if: inputs.gradle-plugin-version == '1.x'
        run: |
          n=0; until ./gradlew runPluginVerifier ${{ inputs.gradle-args }}; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::runPluginVerifier failed after $n attempts"; exit 1; }
            echo "::warning::runPluginVerifier attempt $n failed (transient network?), retrying in 30s"; sleep 30
          done

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-report
          path: |
            build/reports/pluginVerifier/
            build/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 30
